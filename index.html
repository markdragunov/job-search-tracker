<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Search Tracker</title>
<style>
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --border: #e5e7eb;
  --border-light: #f0f2f5;
  --text: #111827;
  --muted: #6b7280;
  --blue: #2563eb;
  --blue-light: #eff6ff;
  --radius: 12px;
  color-scheme: light;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 14px;
  line-height: 1.5;
}

/* HEADER */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  position: sticky;
  top: 0;
  z-index: 20;
}
.header h1 { font-size: 16px; font-weight: 700; }
.header .sub { color: var(--muted); font-size: 12px; margin-top: 1px; }

/* LAYOUT */
.wrap { max-width: 1300px; margin: 0 auto; padding: 16px; }

/* STATS */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
  gap: 8px;
  margin-bottom: 14px;
}
.stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 8px;
  text-align: center;
}
.stat .n { font-size: 22px; font-weight: 800; line-height: 1; }
.stat .l { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-top: 3px; }

/* TOOLBAR */
.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
  margin-bottom: 12px;
}
.toolbar input[type="text"] {
  flex: 1;
  min-width: 140px;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  background: var(--bg);
  font-family: inherit;
}
.toolbar input[type="text"]:focus { outline: none; border-color: var(--blue); }
.toolbar select {
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  background: var(--bg);
  cursor: pointer;
}
.btn {
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid transparent;
  font-family: inherit;
  white-space: nowrap;
}
.btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
.btn.secondary { background: var(--surface); color: var(--blue); border-color: var(--blue); }
.btn.ghost { background: var(--surface); color: var(--muted); border-color: var(--border); }

/* TABLE — desktop */
.table-wrap {
  overflow-x: auto;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface);
  -webkit-overflow-scrolling: touch;
}
table { width: 100%; border-collapse: collapse; min-width: 960px; }
thead th {
  background: #f8f9fb;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .05em;
  color: var(--muted);
  padding: 10px;
  text-align: left;
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 57px;
}
thead th:hover { background: #f0f2f5; color: var(--text); }
thead th.asc::after { content: " ↑"; }
thead th.desc::after { content: " ↓"; }
tbody td {
  padding: 8px 10px;
  border-bottom: 1px solid var(--border-light);
  vertical-align: middle;
}
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: #fafbfc; }
td.co { font-weight: 600; font-size: 13px; white-space: nowrap; }
td.role { color: var(--muted); font-size: 12px; max-width: 150px; }
.fit-badge {
  display: inline-block;
  min-width: 28px;
  text-align: center;
  padding: 2px 6px;
  border-radius: 6px;
  font-weight: 700;
  font-size: 12px;
}
select.stage-sel, select.prio-sel {
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 5px 6px;
  font-size: 12px;
  cursor: pointer;
  max-width: 128px;
}
input.editable {
  border: 1px solid transparent;
  background: transparent;
  padding: 5px 6px;
  font-size: 12px;
  width: 100%;
  border-radius: 6px;
  font-family: inherit;
  color: var(--text);
}
input.editable:focus { border-color: var(--blue); background: var(--surface); outline: none; }
.salary { font-size: 11px; color: var(--muted); white-space: nowrap; }
.del { color: #d1d5db; cursor: pointer; font-size: 18px; border: none; background: none; padding: 4px 8px; border-radius: 6px; line-height: 1; }
.del:hover { color: #ef4444; background: #fef2f2; }
.lnk { text-decoration: none; font-size: 15px; color: var(--muted); display: inline-block; padding: 2px 4px; border-radius: 5px; }
.lnk:hover { color: var(--blue); background: var(--blue-light); }

/* MOBILE CARDS */
.cards { display: none; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 10px;
}
.card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 10px;
}
.card-info { flex: 1; min-width: 0; }
.card-company { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 6px; }
.card-role { color: var(--muted); font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-selects { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.card-selects select {
  width: 100%;
  padding: 9px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
}
.card-field { margin-bottom: 8px; }
.card-field label {
  display: block;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .05em;
  color: var(--muted);
  margin-bottom: 4px;
  font-weight: 600;
}
.card-field input {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  font-family: inherit;
  background: var(--bg);
  color: var(--text);
}
.card-field input:focus { border-color: var(--blue); outline: none; background: var(--surface); }
.card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border-light);
}
.card-salary { font-size: 11px; color: var(--muted); }
.card-actions { display: flex; gap: 8px; align-items: center; }
.note-toggle {
  font-size: 12px;
  color: var(--blue);
  cursor: pointer;
  background: none;
  border: none;
  padding: 0;
  font-family: inherit;
  text-decoration: underline;
  text-decoration-style: dotted;
}
.note-body { display: none; margin-top: 8px; }
.note-body.open { display: block; }
.note-body input {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 12px;
  font-family: inherit;
  background: var(--bg);
  color: var(--muted);
}
.note-body input:focus { border-color: var(--blue); outline: none; background: var(--surface); color: var(--text); }

/* FOOTER */
.foot { margin-top: 12px; color: var(--muted); font-size: 11px; text-align: center; padding: 8px; }

/* RESPONSIVE */
@media (max-width: 820px) {
  .table-wrap { display: none; }
  .cards { display: block; }
  .header { padding: 12px 16px; }
  .header h1 { font-size: 14px; }
  .header .sub { display: none; }
  .wrap { padding: 10px; }
  .stats { grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .stat { padding: 8px 4px; }
  .stat .n { font-size: 18px; }
  .stat .l { font-size: 9px; }
  .toolbar { padding: 8px 10px; }
  .toolbar input[type="text"] { min-width: 0; }
  .btn { padding: 8px 10px; font-size: 12px; }
}
</style>
</head>

const KEY = "mark_job_tracker_v25";
let data = load();
let sortKey = null, sortDir = 1;

function load(){
  try { const s = localStorage.getItem(KEY); if(s) return JSON.parse(s); } catch(e){}
  return JSON.parse(JSON.stringify(SEED));
}
function save(){ localStorage.setItem(KEY, JSON.stringify(data)); }

function fitColor(f){
  if(f >= 8.5) return "#86efac";
  if(f >= 7.5) return "#bbf7d0";
  if(f >= 7)   return "#fde68a";
  return "#fed7aa";
}

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function getView(){
  const q  = document.getElementById("search").value.toLowerCase();
  const fS = document.getElementById("filterStage").value;
  const fP = document.getElementById("filterPrio").value;
  let view = data.map((d,i) => ({d,i}));
  if(q)  view = view.filter(x => (x.d.company + " " + x.d.role).toLowerCase().includes(q));
  if(fS) view = view.filter(x => x.d.stage === fS);
  if(fP) view = view.filter(x => x.d.prio === fP);
  if(sortKey) view.sort((a,b) => {
    let va = a.d[sortKey], vb = b.d[sortKey];
    if(typeof va === "number") return (va - vb) * sortDir;
    return String(va).localeCompare(String(vb)) * sortDir;
  });
  return view;
}

function renderStats(){
  const counts = {};
  STAGES.forEach(s => counts[s] = 0);
  data.forEach(d => counts[d.stage] = (counts[d.stage]||0) + 1);
  const active = data.filter(d => ["Applied","Screening","Interview"].includes(d.stage)).length;
  let html = `<div class="stat"><div class="n">${data.length}</div><div class="l">Всего</div></div>`;
  html += `<div class="stat"><div class="n">${active}</div><div class="l">В работе</div></div>`;
  ["To apply","Applied","Screening","Interview","Offer","Rejected"].forEach(s => {
    html += `<div class="stat"><div class="n">${counts[s]||0}</div><div class="l">${s}</div></div>`;
  });
  document.getElementById("stats").innerHTML = html;
}

function renderTable(view){
  document.getElementById("rows").innerHTML = view.map(({d,i}) => {
    const stageOpts = STAGES.map(s => `<option ${s===d.stage?"selected":""}>${s}</option>`).join("");
    const prioOpts  = PRIOS.map(p  => `<option ${p===d.prio ?"selected":""}>${p}</option>`).join("");
    return `<tr>
      <td class="co">${esc(d.company)}</td>
      <td>${d.url?`<a class="lnk" href="${esc(d.url)}" target="_blank" rel="noopener">↗</a>`:""}</td>
      <td class="role">${esc(d.role)}</td>
      <td><select class="prio-sel" data-i="${i}" style="background:${PRIO_C[d.prio]||'#fff'}">${prioOpts}</select></td>
      <td><span class="fit-badge" style="background:${fitColor(d.fit)}">${d.fit}</span></td>
      <td><select class="stage-sel" data-i="${i}" style="background:${STAGE_C[d.stage]||'#fff'}">${stageOpts}</select></td>
      <td class="salary">${esc(d.salary)}</td>
      <td><input class="editable next-inp" data-i="${i}" value="${esc(d.next)}" placeholder="—"></td>
      <td><input class="editable note-inp" data-i="${i}" value="${esc(d.note)}" placeholder="—"></td>
      <td><button class="del" data-i="${i}">×</button></td>
    </tr>`;
  }).join("");
}

function renderCards(view){
  document.getElementById("cards").innerHTML = view.map(({d,i}) => {
    const stageOpts = STAGES.map(s => `<option ${s===d.stage?"selected":""}>${s}</option>`).join("");
    const prioOpts  = PRIOS.map(p  => `<option ${p===d.prio ?"selected":""}>${p}</option>`).join("");
    const hasNote = d.note && d.note.trim();
    return `<div class="card">
      <div class="card-top">
        <div class="card-info">
          <div class="card-company">
            ${esc(d.company)}
            ${d.url?`<a class="lnk" href="${esc(d.url)}" target="_blank" rel="noopener">↗</a>`:""}
          </div>
          <div class="card-role">${esc(d.role)}</div>
        </div>
        <span class="fit-badge" style="background:${fitColor(d.fit)};flex-shrink:0">${d.fit}</span>
      </div>
      <div class="card-selects">
        <select class="stage-sel" data-i="${i}" style="background:${STAGE_C[d.stage]||'#fff'}">${stageOpts}</select>
        <select class="prio-sel" data-i="${i}" style="background:${PRIO_C[d.prio]||'#fff'}">${prioOpts}</select>
      </div>
      <div class="card-field">
        <label>Next action</label>
        <input class="next-inp" data-i="${i}" value="${esc(d.next)}" placeholder="—">
      </div>
      <div class="card-footer">
        <span class="card-salary">${esc(d.salary)}</span>
        <div class="card-actions">
          ${hasNote?`<button class="note-toggle">Заметки</button>`:""}
          <button class="del" data-i="${i}">×</button>
        </div>
      </div>
      ${hasNote?`<div class="note-body"><input class="note-inp" data-i="${i}" value="${esc(d.note)}"></div>`:""}
    </div>`;
  }).join("");
}

function render(){
  const view = getView();
  renderStats();
  renderTable(view);
  renderCards(view);
  document.querySelectorAll("th[data-sort]").forEach(th => {
    th.classList.remove("asc","desc");
    if(th.dataset.sort === sortKey) th.classList.add(sortDir === 1 ? "asc" : "desc");
  });
}

// Event delegation
document.addEventListener("change", e => {
  const el = e.target, i = +el.dataset.i;
  if(isNaN(i)) return;
  if(el.classList.contains("stage-sel"))     { data[i].stage = el.value; save(); render(); }
  else if(el.classList.contains("prio-sel")) { data[i].prio  = el.value; save(); render(); }
  else if(el.classList.contains("next-inp")) { data[i].next  = el.value; save(); }
  else if(el.classList.contains("note-inp")) { data[i].note  = el.value; save(); }
});

document.addEventListener("click", e => {
  if(e.target.classList.contains("del")){
    const i = +e.target.dataset.i;
    if(confirm("Удалить строку?")){ data.splice(i,1); save(); render(); }
  }
  if(e.target.classList.contains("note-toggle")){
    const body = e.target.closest(".card").querySelector(".note-body");
    if(!body) return;
    body.classList.toggle("open");
    e.target.textContent = body.classList.contains("open") ? "Скрыть" : "Заметки";
  }
});

// Sort
document.querySelectorAll("th[data-sort]").forEach(th => th.onclick = () => {
  const k = th.dataset.sort;
  sortKey === k ? sortDir *= -1 : (sortKey = k, sortDir = 1);
  render();
});

// Toolbar
document.getElementById("search").addEventListener("input", render);
document.getElementById("filterStage").addEventListener("change", render);
document.getElementById("filterPrio").addEventListener("change", render);
document.getElementById("addBtn").onclick = () => {
  data.unshift({company:"Новая компания",role:"Senior PM",prio:"Средний",fit:7,stage:"Not started",salary:"уточнить",next:"",note:"",url:""});
  save(); render();
};
document.getElementById("resetBtn").onclick = () => {
  if(confirm("Сбросить все изменения к исходным данным?")){
    data = JSON.parse(JSON.stringify(SEED)); save(); render();
  }
};

// Init filters
(function(){
  const fs = document.getElementById("filterStage");
  STAGES.forEach(s => { const o=document.createElement("option"); o.value=s; o.textContent=s; fs.appendChild(o); });
  const fp = document.getElementById("filterPrio");
  PRIOS.forEach(p => { const o=document.createElement("option"); o.value=p; o.textContent=p; fp.appendChild(o); });
})();

render();
</script>
</body>
</html>

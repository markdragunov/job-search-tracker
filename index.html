<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Job Search Tracker — Senior PM, Payments</title>
<style>
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --border: #e5e7eb;
  --border-light: #f0f2f5;
  --text: #111827;
  --muted: #6b7280;
  --blue: #2563eb;
  --blue-light: #eff6ff;
  --radius: 12px;
  color-scheme: light;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 14px;
  line-height: 1.5;
}

/* HEADER */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  position: sticky;
  top: 0;
  z-index: 20;
}
.header h1 { font-size: 16px; font-weight: 700; }
.header .sub { color: var(--muted); font-size: 12px; margin-top: 1px; }

/* LAYOUT */
.wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }

/* STATS */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
  gap: 8px;
  margin-bottom: 14px;
}
.stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 8px;
  text-align: center;
}
.stat .n { font-size: 22px; font-weight: 800; line-height: 1; }
.stat .l { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-top: 3px; }

/* TOOLBAR */
.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
  margin-bottom: 12px;
}
.toolbar input[type="text"] {
  flex: 1;
  min-width: 140px;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  background: var(--bg);
  font-family: inherit;
}
.toolbar input[type="text"]:focus { outline: none; border-color: var(--blue); }
.toolbar select {
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  background: var(--bg);
  cursor: pointer;
}

/* TABLE — desktop */
.table-wrap {
  overflow-x: auto;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface);
  -webkit-overflow-scrolling: touch;
}
table { width: 100%; border-collapse: collapse; min-width: 700px; }
thead th {
  background: #f8f9fb;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .05em;
  color: var(--muted);
  padding: 10px;
  text-align: left;
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 57px;
}
thead th:hover { background: #f0f2f5; color: var(--text); }
thead th.asc::after { content: " ↑"; }
thead th.desc::after { content: " ↓"; }
tbody td {
  padding: 9px 10px;
  border-bottom: 1px solid var(--border-light);
  vertical-align: middle;
}
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: #fafbfc; }
td.co { font-weight: 600; font-size: 13px; white-space: nowrap; }
td.role { color: var(--muted); font-size: 12px; }
.fit-badge {
  display: inline-block;
  min-width: 28px;
  text-align: center;
  padding: 2px 7px;
  border-radius: 6px;
  font-weight: 700;
  font-size: 12px;
}
.stage-pill {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}
.salary { font-size: 11px; color: var(--muted); white-space: nowrap; }
.lnk { text-decoration: none; font-size: 14px; color: var(--muted); padding: 2px 4px; border-radius: 5px; }
.lnk:hover { color: var(--blue); background: var(--blue-light); }

/* MOBILE CARDS */
.cards { display: none; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 10px;
}
.card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 10px;
}
.card-info { flex: 1; min-width: 0; }
.card-company { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 6px; }
.card-role { color: var(--muted); font-size: 12px; margin-top: 2px; }
.card-badges { display: flex; gap: 6px; align-items: center; flex-shrink: 0; flex-direction: column; align-items: flex-end; }
.card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border-light);
  gap: 8px;
  flex-wrap: wrap;
}
.card-salary { font-size: 11px; color: var(--muted); }

/* FOOTER */
.foot { margin-top: 12px; color: var(--muted); font-size: 11px; text-align: center; padding: 8px; }

/* RESPONSIVE */
@media (max-width: 720px) {
  .table-wrap { display: none; }
  .cards { display: block; }
  .header { padding: 12px 16px; }
  .header h1 { font-size: 14px; }
  .header .sub { display: none; }
  .wrap { padding: 10px; }
  .stats { grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .stat { padding: 8px 4px; }
  .stat .n { font-size: 18px; }
  .stat .l { font-size: 9px; }
  .toolbar { padding: 8px 10px; }
  .toolbar input[type="text"] { min-width: 0; }
}
</style>
</head>
<body>

<header class="header">
  <h1>Job Search Tracker</h1>
  <div class="sub">Senior PM · Payments / Fintech / Crypto · Remote EU · June 2026</div>
</header>

<div class="wrap">
  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <input id="search" type="text" placeholder="Search company or role…">
    <select id="filterStage"><option value="">All stages</option></select>
  </div>

  <!-- Desktop table -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th data-sort="company">Company</th>
          <th></th>
          <th data-sort="role">Role</th>
          <th data-sort="fit">Fit</th>
          <th data-sort="stage">Stage</th>
          <th data-sort="salary">Salary (est.)</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <!-- Mobile cards -->
  <div class="cards" id="cards"></div>

  <p class="foot">Personal job search tracker · Senior PM, Payments / Fintech / Crypto · Remote EU</p>
</div>

<script>

  {company:"Yuno",role:"Senior PM, Core Team",fit:8.5,stage:"Not started",salary:"уточнить",url:"https://jobs.lever.co/yuno/08c6d583-5bba-4c56-81c2-9fd9991d7110"},
  {company:"Primer",role:"PM, Orchestration",fit:8.5,stage:"Not started",salary:"€85–120k",url:"https://jobs.ashbyhq.com/primer.io"},
  {company:"Salmon",role:"TPM, Cards System Analyst",fit:8,stage:"Applied",salary:"TBC",url:"https://salmon.ph/careers"},
  {company:"Salmon",role:"Senior PM, Cross-Border Payments",fit:8,stage:"To apply",salary:"TBC",url:"https://salmon-jobs.super.site/senior-product-manager-cross-border-payments"},
  {company:"Mollie",role:"Senior PM, Payments/Checkout",fit:8,stage:"Not started",salary:"€90–120k",url:"https://jobs.mollie.com/"},
  {company:"BVNK",role:"PM, Stablecoin/Payments",fit:8,stage:"Not started",salary:"€95–130k",url:"https://www.bvnk.com/careers"},
  {company:"Payrails",role:"Senior PM, Payments",fit:8,stage:"Not started",salary:"€90–130k",url:"https://jobs.ashbyhq.com/payrails/c4048896-5de7-4dfa-8bfb-bd7c9b114287"},

  {company:"1inch",role:"Senior Technical PM, Swap",fit:7.5,stage:"To apply",salary:"€100–140k",url:"https://1inch.io/careers/"},
  {company:"WalletConnect / Reown",role:"PM, Wallet infra",fit:7,stage:"Not started",salary:"€100–140k",url:"https://reown.com/careers"},
  {company:"Ramp Network",role:"PM, Payments",fit:8,stage:"Not started",salary:"€90–120k",url:"https://ramp.network/careers"},
  {company:"GoMining",role:"PM, Payments",fit:7.5,stage:"Applied",salary:"TBC",url:"https://apply.workable.com/gomining/"},
  {company:"Nuvei",role:"PM, Payment Gateway",fit:7.5,stage:"Not started",salary:"€85–120k",url:"https://apply.workable.com/nuvei/j/4F4D715492"},
  {company:"Yuno",role:"Senior PM, MX/DX SDK Team",fit:7.5,stage:"Not started",salary:"TBC",url:"https://jobs.lever.co/yuno/52be3369-2156-48c3-b498-4c37d23e33e2"},
  {company:"Deel",role:"Staff PM — Fintech, Client Experience",fit:7.5,stage:"Not started",salary:"TBC",url:"https://jobs.ashbyhq.com/deel/a446c59c-83f8-4034-94e9-baa042884de6"},
  {company:"Trustly",role:"Senior PM, FIC (Open Banking Connectors)",fit:7.5,stage:"Not started",salary:"TBC",url:"https://jobs.lever.co/trustly/6ae42bbd-766a-48ee-8d03-bcd1f4ac2504"},
  {company:"dLocal",role:"Senior PM, Virtual Accounts",fit:7.5,stage:"Not started",salary:"TBC",url:"https://jobs.lever.co/dlocal/82af4022-3088-4513-b540-289a13ce2e9f"},
  {company:"Revolut",role:"Senior PM, Payments/Crypto",fit:7,stage:"Not started",salary:"€90–125k",url:"https://www.revolut.com/careers/"},
  {company:"Coinbase",role:"Senior PM, Stablecoins & Payments",fit:7,stage:"Not started",salary:"€110–150k",url:"https://www.coinbase.com/careers/positions"},
  {company:"Stripe",role:"PM, EMEA Payments Lead",fit:8,stage:"Not started",salary:"€110–150k",url:"https://stripe.com/jobs/search"},
  {company:"Pleo",role:"Senior PM, Financial Core",fit:7,stage:"To apply",salary:"€95–120k",url:"https://www.linkedin.com/jobs/view/4417083615/"},
  {company:"Wise",role:"Senior PM, Servicing Platform",fit:7.5,stage:"Not started",salary:"€90–130k",url:"https://www.wise.jobs/"},
  {company:"Printify",role:"Senior PM, Payment Orchestration",fit:7,stage:"Not started",salary:"TBC",url:"https://startup.jobs/senior-product-manager-payment-orchestration-remote-within-emea-printify-5810650"},
  {company:"Jeeves",role:"PM, Stablecoin & Digital Assets",fit:7,stage:"Not started",salary:"€90–120k",url:"https://jobs.lever.co/tryjeeves/458f8fa9-ff1b-4cde-a703-61e5832ee756"},
  {company:"PawaPay",role:"Payments Product Manager",fit:7,stage:"Not started",salary:"TBC",url:"https://job-boards.eu.greenhouse.io/pawapay/jobs/4836386101"},
  {company:"Bitpanda",role:"Senior PM, Payments/Trading",fit:7,stage:"Not started",salary:"€85–115k",url:"https://www.bitpanda.com/en/career"},
  {company:"Wallet in Telegram",role:"PM, Payments",fit:6,stage:"Not started",salary:"TBC",url:"https://www.tg-wallet.com/careers"},
  {company:"FREE NOW",role:"PM, Invoicing & Partner Payments",fit:6.5,stage:"Not started",salary:"TBC",url:"https://boards.greenhouse.io/freenow/jobs/3790338"},
  {company:"Ledger",role:"PM, Wallet/Payments",fit:6.5,stage:"Not started",salary:"€90–120k",url:"https://www.ledger.com/careers"},
  {company:"Mollie",role:"PM, Cards",fit:6.5,stage:"Not started",salary:"TBC",url:"https://jobs.mollie.com/"},
  {company:"Qonto",role:"Senior PM, Savings",fit:6.5,stage:"Not started",salary:"€85–115k",url:"https://qonto.com/en/careers"},
  {company:"BVNK",role:"PM, Billing & Fees",fit:6.5,stage:"Not started",salary:"TBC",url:"https://job-boards.eu.greenhouse.io/bvnk/jobs/4875965101"},
  {company:"Checkout.com",role:"Senior PM, Card Processing",fit:7,stage:"Not started",salary:"€90–130k",url:"https://jobs.ashbyhq.com/checkout.com/12cddf3a-be1f-4d4b-b168-f342406cab50"},
  {company:"Constructor",role:"PM, Connector Integrations",fit:7.5,stage:"Rejected",salary:"€90–120k",url:"https://job-boards.greenhouse.io/constructor"},
  {company:"Salmon",role:"TPM, Reconciliation",fit:6.5,stage:"Applied",salary:"TBC",url:"https://jobs.ashbyhq.com/salmon-group/ecccd048-5ea9-478e-bdc9-553233e7a69f"},
];

const STAGES_ORDER = {"Not started":0,"To apply":1,"Applied":2,"Screening":3,"Interview":4,"Offer":5,"Rejected":6};
let sortKey = "fit", sortDir = -1;

function fitColor(f){
  if(f >= 8.5) return "#86efac";
  if(f >= 8)   return "#bbf7d0";
  if(f >= 7)   return "#fde68a";
  return "#fed7aa";
}

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function getView(){
  const q  = document.getElementById("search").value.toLowerCase();
  const fS = document.getElementById("filterStage").value;
  let view = DATA.map((d,i) => ({d,i}));
  if(q)  view = view.filter(x => (x.d.company + " " + x.d.role).toLowerCase().includes(q));
  if(fS) view = view.filter(x => x.d.stage === fS);
  view.sort((a,b) => {
    let va = a.d[sortKey], vb = b.d[sortKey];
    if(sortKey === "stage") { va = STAGES_ORDER[va]||0; vb = STAGES_ORDER[vb]||0; }
    if(typeof va === "number") return (va - vb) * sortDir;
    return String(va).localeCompare(String(vb)) * sortDir;
  });
  return view;
}

function renderStats(){
  const counts = {};
  STAGES.forEach(s => counts[s] = 0);
  DATA.forEach(d => counts[d.stage] = (counts[d.stage]||0) + 1);
  const active = DATA.filter(d => ["Applied","Screening","Interview"].includes(d.stage)).length;
  let html = `<div class="stat"><div class="n">${DATA.length}</div><div class="l">Total</div></div>`;
  html += `<div class="stat"><div class="n">${active}</div><div class="l">Active</div></div>`;
  ["To apply","Applied","Screening","Interview","Offer","Rejected"].forEach(s => {
    html += `<div class="stat"><div class="n">${counts[s]||0}</div><div class="l">${s}</div></div>`;
  });
  document.getElementById("stats").innerHTML = html;
}

function renderTable(view){
  document.getElementById("rows").innerHTML = view.map(({d}) => {
    return `<tr>
      <td class="co">${esc(d.company)}</td>
      <td>${d.url?`<a class="lnk" href="${esc(d.url)}" target="_blank" rel="noopener">↗</a>`:""}</td>
      <td class="role">${esc(d.role)}</td>
      <td><span class="fit-badge" style="background:${fitColor(d.fit)}">${d.fit}</span></td>
      <td><span class="stage-pill" style="background:${STAGE_C[d.stage]||'#e5e7eb'}">${esc(d.stage)}</span></td>
      <td class="salary">${esc(d.salary)}</td>
    </tr>`;
  }).join("");
}

function renderCards(view){
  document.getElementById("cards").innerHTML = view.map(({d}) => {
    return `<div class="card">
      <div class="card-top">
        <div class="card-info">
          <div class="card-company">
            ${esc(d.company)}
            ${d.url?`<a class="lnk" href="${esc(d.url)}" target="_blank" rel="noopener">↗</a>`:""}
          </div>
          <div class="card-role">${esc(d.role)}</div>
        </div>
        <div class="card-badges">
          <span class="fit-badge" style="background:${fitColor(d.fit)}">${d.fit}</span>
        </div>
      </div>
      <div class="card-footer">
        <span class="stage-pill" style="background:${STAGE_C[d.stage]||'#e5e7eb'}">${esc(d.stage)}</span>
        <span class="card-salary">${esc(d.salary)}</span>
      </div>
    </div>`;
  }).join("");
}

function render(){
  const view = getView();
  renderStats();
  renderTable(view);
  renderCards(view);
  document.querySelectorAll("th[data-sort]").forEach(th => {
    th.classList.remove("asc","desc");
    if(th.dataset.sort === sortKey) th.classList.add(sortDir === 1 ? "asc" : "desc");
  });
}

document.querySelectorAll("th[data-sort]").forEach(th => th.onclick = () => {
  const k = th.dataset.sort;
  sortKey === k ? sortDir *= -1 : (sortKey = k, sortDir = 1);
  render();
});
document.getElementById("search").addEventListener("input", render);
document.getElementById("filterStage").addEventListener("change", render);

(function(){
  const fs = document.getElementById("filterStage");
  STAGES.forEach(s => { const o=document.createElement("option"); o.value=s; o.textContent=s; fs.appendChild(o); });
})();

renderStats();
render();
</script>
</body>
</html>

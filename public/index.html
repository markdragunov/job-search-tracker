<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Tracker — Senior PM</title>
<style>
:root {
  --bg: #f4f6f9; --surface: #fff; --border: #e5e7eb;
  --border-light: #f0f2f5; --text: #111827; --muted: #6b7280;
  --blue: #2563eb; --blue-light: #eff6ff; --radius: 12px;
  color-scheme: light;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { overflow-x: auto; }
body { min-width: 720px; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 14px; line-height: 1.5; }

/* TOPBAR */
.topbar { background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 12px 20px; position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.topbar-title h1 { font-size: 15px; font-weight: 700; }
.topbar-title .sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
.topbar-right { display: flex; align-items: center; gap: 8px; }
.view-toggle { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.view-btn { padding: 5px 11px; font-size: 12px; font-weight: 500; cursor: pointer;
  background: var(--bg); color: var(--muted); border: none; transition: background .15s; white-space: nowrap; }
.view-btn.active { background: var(--surface); color: var(--text); }
.funnel-toggle-btn { padding: 5px 10px; font-size: 12px; font-weight: 500; cursor: pointer;
  background: var(--bg); color: var(--muted); border: 1px solid var(--border);
  border-radius: 8px; transition: background .15s; white-space: nowrap; }
.funnel-toggle-btn.active { background: #ede9fe; color: #5b21b6; border-color: #c4b5fd; }

/* PIPELINE */
.pipeline { background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 10px 20px; display: flex; flex-direction: column; gap: 0;
  position: sticky; top: 61px; z-index: 18; }
.pills-row { display: flex; align-items: center; gap: 6px; overflow-x: auto; }
.pip { flex: 1; min-width: 60px; border: 1px solid var(--border); border-radius: 10px;
  padding: 8px 6px; text-align: center; background: var(--bg); cursor: pointer;
  transition: border-color .15s, background .15s; user-select: none; }
.pip:hover { border-color: #c4b5fd; }
.pip.active-filter { border-color: #7c3aed; background: #faf5ff; }
.pip .pn { font-size: 20px; font-weight: 800; line-height: 1; }
.pip .pl { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-top: 3px; }
.pip.s-new { background: #faf5ff; border-color: #ddd6fe; }
.pip.s-new .pn { color: #6d28d9; }
.pip.s-active { background: #eff6ff; border-color: #bfdbfe; }
.pip.s-active .pn { color: #1d4ed8; }
.pip.s-closed { background: #f9fafb; border-color: #e5e7eb; }
.pip.s-closed .pn { color: #6b7280; }
.pip-arrow { color: #d1d5db; font-size: 16px; flex-shrink: 0; }

/* FUNNEL ROW */
.funnel-row { display: none; align-items: center; gap: 0;
  padding: 8px 0 2px; border-top: 1px solid var(--border-light); margin-top: 8px;
  overflow-x: auto; }
.funnel-row.show { display: flex; }
.f-step { display: flex; flex-direction: column; align-items: center; min-width: 80px; }
.f-step-num { font-size: 18px; font-weight: 800; line-height: 1; }
.f-step-label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-top: 2px; }
.f-arrow { display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 0 6px; flex-shrink: 0; }
.f-arrow-line { font-size: 14px; color: #d1d5db; line-height: 1; }
.f-arrow-pct { font-size: 10px; font-weight: 600; color: var(--muted); margin-top: 2px; white-space: nowrap; }
.f-arrow-pct.good { color: #16a34a; }
.f-arrow-pct.mid  { color: #ca8a04; }
.f-arrow-pct.low  { color: #dc2626; }

/* TOOLBAR */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  background: #f8f9fb; border-bottom: 1px solid var(--border);
  padding: 9px 20px; position: sticky; top: 121px; z-index: 17; }
.toolbar-search { display: flex; align-items: center; gap: 6px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; flex: 1; min-width: 160px; max-width: 280px; }
.toolbar-search input { border: none; outline: none; font-size: 13px; background: transparent;
  color: var(--text); width: 100%; font-family: inherit; }
.toolbar select { padding: 7px 10px; border: 1px solid var(--border);
  border-radius: 8px; font-size: 13px; background: var(--surface); color: var(--text); cursor: pointer; }
.active-only-btn { padding: 6px 12px; font-size: 12px; font-weight: 500; cursor: pointer;
  border: 1px solid var(--border); border-radius: 8px; background: var(--surface);
  color: var(--muted); white-space: nowrap; transition: background .15s; }
.active-only-btn.on { background: #ecfdf5; color: #065f46; border-color: #6ee7b7; }
.clear-btn { padding: 6px 12px; font-size: 12px; border: 1px solid var(--border);
  border-radius: 8px; background: var(--surface); color: var(--muted); cursor: pointer; display: none; }
.clear-btn.visible { display: block; }

/* TABLE */
.table-wrap { background: var(--surface); }
table { width: 100%; border-collapse: collapse; min-width: 780px; }
thead th { background: #f8f9fb; font-size: 10px; text-transform: uppercase;
  letter-spacing: .06em; color: var(--muted); padding: 9px 12px; text-align: left;
  cursor: pointer; user-select: none; white-space: nowrap;
  border-bottom: 1px solid var(--border); position: sticky; top: 169px; z-index: 10; }
thead th:hover { background: #f0f2f5; color: var(--text); }
thead th.asc::after { content: " ↑"; }
thead th.desc::after { content: " ↓"; }
tbody tr { border-bottom: 1px solid var(--border-light); }
tbody tr:hover td { background: #fafbfc; }
tbody td { padding: 0; vertical-align: middle; }

/* DIM inactive rows */
tbody tr.row-dim { opacity: 0.38; }
tbody tr.row-dim:hover { opacity: 0.7; }
tbody tr.row-dim .co-name { text-decoration: line-through; text-decoration-color: #9ca3af; }

/* GROUP separator */
tr.group-sep td { padding: 6px 12px 4px; background: var(--bg); border-bottom: none; }
tr.group-sep .group-label { font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .07em; display: flex; align-items: center; gap: 6px; }
tr.group-sep .group-count { font-size: 10px; color: var(--muted); font-weight: 400; }

/* Row accent bar */
.row-bar { width: 4px; height: 100%; min-height: 46px; }

/* Avatar */
.co-avatar { width: 32px; height: 32px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; flex-shrink: 0; letter-spacing: -0.02em; }
.co-name { font-size: 13px; font-weight: 600; }
.co-role { font-size: 11px; color: var(--muted); margin-top: 1px; }

/* Note — hidden until row hover */
.co-note { font-size: 11px; color: #9ca3af; margin-top: 3px; min-height: 14px;
  cursor: text; border-bottom: 1px dashed transparent; transition: border-color .15s, color .15s; }
.co-note:hover { border-color: #d1d5db; }
.co-note:empty::before { content: attr(data-ph); color: transparent; transition: color .15s; }
tbody tr:hover .co-note:empty::before { color: #d1d5db; }
.note-input { font-size: 11px; color: var(--text); font-family: inherit;
  border: none; border-bottom: 1px solid var(--blue); outline: none;
  background: transparent; width: 100%; padding: 0; }
.co-added { font-size: 10px; color: #c4c9d4; margin-top: 2px; }

/* Fit badge */
.fit-sq { width: 34px; height: 34px; border-radius: 8px; display: flex;
  align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }

/* Priority cell — hidden until row hover */
.prio-cell { font-size: 13px; cursor: pointer; padding: 4px 2px; border-radius: 6px;
  user-select: none; text-align: center; line-height: 1.2; transition: background .15s;
  white-space: nowrap; }
.prio-cell:hover { background: var(--bg); }
.prio-cell.empty { font-size: 16px; opacity: 0; transition: opacity .15s; }
tbody tr:hover .prio-cell.empty { opacity: 1; color: #d1d5db; }

/* Stage select + days badge */
.stage-wrap { display: flex; flex-direction: column; gap: 3px; }
.stage-select { appearance: auto; padding: 3px 8px; border-radius: 999px;
  border: 1px solid transparent; font-size: 11px; font-weight: 600;
  cursor: pointer; font-family: inherit; outline: none; }
.stage-select:hover { border-color: rgba(0,0,0,.1); }
.stage-select.saving { opacity: .6; pointer-events: none; }
.days-badge { font-size: 10px; color: var(--muted); padding-left: 2px;
  display: flex; align-items: center; gap: 3px; }
.days-badge .days-num { font-weight: 600; }
.days-badge.stale .days-num { color: #f59e0b; }
.days-badge.overdue .days-num { color: #ef4444; }

/* Date follow-up — hidden until row hover, colored when set */
.date-inp { font-size: 11px; border: none; background: transparent;
  font-family: inherit; cursor: pointer; padding: 3px 4px; border-radius: 6px;
  border: 1px solid transparent; transition: opacity .15s; }
.date-inp:not(.has-date) { opacity: 0; }
tbody tr:hover .date-inp:not(.has-date) { opacity: 0.5; }
.date-inp.has-date { opacity: 1; color: var(--text); }
.date-inp:hover { border-color: var(--border); background: var(--bg); opacity: 1 !important; }
.date-inp:focus { outline: none; border-color: var(--blue); background: var(--surface); opacity: 1 !important; }

/* Follow-up color states */
.fu-overdue { color: #dc2626 !important; font-weight: 600; }
.fu-today   { color: #ea580c !important; font-weight: 600; }
.fu-tomorrow{ color: #ca8a04 !important; }
.fu-future  { color: var(--text) !important; }

.salary-cell { font-size: 11px; color: var(--muted); white-space: nowrap; }
.lnk { text-decoration: none; font-size: 15px; color: #d1d5db; padding: 2px 6px;
  border-radius: 5px; }
.lnk:hover { color: var(--blue); background: var(--blue-light); }
tbody tr:hover .lnk { color: #9ca3af; }

/* Toast */
.toast { position: fixed; bottom: 20px; right: 20px; background: #1f2937; color: #fff;
  padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 500;
  box-shadow: 0 4px 12px rgba(0,0,0,.2); z-index: 999; opacity: 0;
  transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }

/* Loading */
.loading { text-align: center; padding: 40px; color: var(--muted); font-size: 13px; }

/* FOCUS VIEW */
.focus-view { display: none; padding: 16px 20px; }
.focus-view.show { display: block; }
.focus-section { margin-bottom: 20px; }
.focus-section-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
  padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.focus-section-title { font-size: 13px; font-weight: 700; }
.focus-section-count { font-size: 11px; color: var(--muted);
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 999px; padding: 1px 8px; }
.focus-empty { font-size: 12px; color: #d1d5db; padding: 8px 0; }
.focus-card { background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 14px; margin-bottom: 8px;
  display: flex; align-items: center; gap: 12px; }
.focus-card:hover { border-color: #c4b5fd; }
.focus-card-main { flex: 1; min-width: 0; }
.focus-card-co { font-size: 13px; font-weight: 600; }
.focus-card-role { font-size: 11px; color: var(--muted); margin-top: 1px; }
.focus-card-meta { display: flex; align-items: center; gap: 8px; margin-top: 5px; flex-wrap: wrap; }
.focus-badge { font-size: 10px; padding: 2px 7px; border-radius: 999px;
  font-weight: 600; white-space: nowrap; }
.focus-days { font-size: 11px; color: var(--muted); }
.focus-card-fit { width: 30px; height: 30px; border-radius: 7px; display: flex;
  align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
.focus-card-link { font-size: 14px; color: #d1d5db; text-decoration: none;
  padding: 3px 6px; border-radius: 5px; flex-shrink: 0; }
.focus-card-link:hover { color: var(--blue); background: var(--blue-light); }
.focus-fu-badge { font-size: 11px; font-weight: 600; padding: 2px 8px;
  border-radius: 999px; white-space: nowrap; }
.focus-fu-overdue { background: #fee2e2; color: #991b1b; }
.focus-fu-today   { background: #ffedd5; color: #9a3412; }
.focus-fu-tomorrow{ background: #fef9c3; color: #854d0e; }

/* KANBAN */
.kanban-view { display: none; overflow-x: auto; padding: 16px 20px; gap: 10px; }
.kanban-view.show { display: flex; }
.k-col { min-width: 180px; max-width: 200px; flex-shrink: 0; }
.k-col-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.k-col-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.k-col-count { background: var(--surface); border: 1px solid var(--border);
  border-radius: 999px; padding: 1px 7px; font-size: 11px; color: var(--muted); }
.k-card { background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px; margin-bottom: 8px; }
.k-card-co { font-size: 12px; font-weight: 600; }
.k-card-role { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.3; }
.k-card-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
.k-fit { width: 24px; height: 24px; border-radius: 5px; display: flex;
  align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
.k-salary { font-size: 10px; color: var(--muted); }
.k-empty { padding: 16px; text-align: center; font-size: 12px; color: #d1d5db;
  border: 1px dashed var(--border); border-radius: 10px; }

.foot { color: var(--muted); font-size: 11px; text-align: center; padding: 16px; }

@media (max-width: 720px) {
  .kanban-view { display: none !important; }
  .view-toggle { display: none; }
  .pipeline { padding: 8px 12px; gap: 4px; }
  .pip { min-width: 48px; padding: 6px 4px; }
  .pip .pn { font-size: 17px; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-title">
    <h1>Job Tracker</h1>
    <div class="sub">Senior PM · Payments / Fintech / Crypto · Remote EU</div>
  </div>
  <div class="topbar-right">
    <button class="funnel-toggle-btn" id="funnelToggleBtn" onclick="toggleFunnel()">📊 Funnel</button>
    <div class="view-toggle">
      <button class="view-btn active" id="btnTable"  onclick="setView('table')">☰ Table</button>
      <button class="view-btn"        id="btnFocus"  onclick="setView('focus')">⚡ Focus</button>
      <button class="view-btn"        id="btnKanban" onclick="setView('kanban')">⊞ Kanban</button>
    </div>
  </div>
</header>

<div class="pipeline" id="pipeline">
  <div class="pills-row" id="pillsRow"></div>
  <div class="funnel-row" id="funnelRow"></div>
</div>

<div class="toolbar">
  <div class="toolbar-search">
    <span style="color:var(--muted)">⌕</span>
    <input id="search" type="text" placeholder="Search company or role…">
  </div>
  <select id="filterStage"><option value="">All stages</option></select>
  <button class="active-only-btn" id="activeOnlyBtn" onclick="toggleActiveOnly()">⚡ Active only</button>
  <button class="clear-btn" id="clearBtn" onclick="clearFilters()">✕ Clear</button>
</div>

<div class="table-wrap" id="tableView">
  <div class="loading" id="loadingMsg">Loading…</div>
  <table id="jobTable" style="display:none;">
    <thead>
      <tr>
        <th style="width:4px; padding:0; cursor:default;"></th>
        <th style="width:44px; cursor:default;"></th>
        <th data-sort="company">Company / Role</th>
        <th data-sort="stage"  style="width:150px;">Stage</th>
        <th style="width:110px; cursor:default;">Follow-up</th>
        <th data-sort="fit"    style="width:52px;">Fit</th>
        <th data-sort="prio"   style="width:60px;">Prio</th>
        <th data-sort="salary" style="width:90px;">Salary</th>
        <th data-sort="date_added" style="width:70px;">Added</th>
        <th style="width:32px; cursor:default;"></th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<div class="focus-view" id="focusView"></div>
<div class="kanban-view" id="kanbanView"></div>

<p class="foot">mark-d.dev · Job Tracker · 2026</p>
<div class="toast" id="toast"></div>

<script>
const STAGES = ["NEW","To apply","Applied","Screening","Interview","Offer","Rejected","Closed"];
const STAGE_C = {
  "NEW":"#ede9fe","To apply":"#fef9c3","Applied":"#dbeafe",
  "Screening":"#e0e7ff","Interview":"#d1fae5","Offer":"#a7f3d0",
  "Rejected":"#fee2e2","Closed":"#f3f4f6"
};
const STAGE_TC = {
  "NEW":"#5b21b6","To apply":"#854d0e","Applied":"#1e40af",
  "Screening":"#3730a3","Interview":"#065f46","Offer":"#064e3b",
  "Rejected":"#991b1b","Closed":"#6b7280"
};
const STAGE_ACCENT = {
  "NEW":"#a78bfa","To apply":"#fbbf24","Applied":"#60a5fa",
  "Screening":"#818cf8","Interview":"#34d399","Offer":"#10b981",
  "Rejected":"#f87171","Closed":"#d1d5db"
};
const STAGES_ORDER = {"NEW":0,"To apply":1,"Applied":2,"Screening":3,"Interview":4,"Offer":5,"Rejected":6,"Closed":7};
const ICONS = {"NEW":"✦","To apply":"→","Applied":"✉","Screening":"◎","Interview":"◈","Offer":"★","Rejected":"✕","Closed":"○"};
const FUNNEL_STAGES = ["Applied","Screening","Interview","Offer"];
const ACTIVE_STAGES = new Set(["To apply","Applied","Screening","Interview","Offer"]);
const DIM_STAGES   = new Set(["Rejected","Closed"]);

const PRIO_LEVELS = [
  { val: 3, emoji: "❤️‍🔥❤️‍🔥❤️‍🔥", label: "СУПЕРХОТ" },
  { val: 2, emoji: "🔥🔥🔥",       label: "ВЫСОКИЙ"  },
  { val: 1, emoji: "❤️❤️❤️",       label: "НРАВИТСЯ" },
  { val: 0, emoji: "👆🏻👆🏻👆🏻",  label: "ПОДУМАТЬ" },
];
function prioInfo(val) {
  if (val === null || val === undefined) return null;
  return PRIO_LEVELS.find(p => p.val === val) || null;
}

const AV_COLORS = [
  ["#dbeafe","#1e40af"],["#ede9fe","#5b21b6"],["#d1fae5","#065f46"],
  ["#fef9c3","#854d0e"],["#fee2e2","#991b1b"],["#e0e7ff","#3730a3"],
  ["#fce7f3","#9d174d"],["#ecfdf5","#065f46"]
];
function avColor(n){ const i=(n.charCodeAt(0)+(n.charCodeAt(1)||0))%AV_COLORS.length; return AV_COLORS[i]; }
function avInitials(n){ const w=n.split(/[\s\/\-]/); return (w[0][0]+(w[1]?w[1][0]:w[0][1]||'')).toUpperCase(); }
function fitBg(f){
  if(f>=9) return["#dcfce7","#166534"];
  if(f>=8.5)return["#bbf7d0","#15803d"];
  if(f>=8) return["#fef9c3","#854d0e"];
  if(f>=7.5)return["#fde68a","#92400e"];
  if(f>=7) return["#fed7aa","#9a3412"];
  return["#fee2e2","#991b1b"];
}
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ── DATE HELPERS ── */
function daysAgo(iso) {
  if (!iso) return '—';
  const d = Math.floor((Date.now() - new Date(iso)) / 86400000);
  if (d === 0) return 'today';
  if (d === 1) return '1d ago';
  return `${d}d ago`;
}
function daysInStage(job) {
  if (!job.stage_updated_at) return null;
  return Math.floor((Date.now() - new Date(job.stage_updated_at)) / 86400000);
}
function isoToDateInput(iso) {
  if (!iso) return '';
  try { return new Date(iso).toISOString().split('T')[0]; } catch(e) { return ''; }
}
// Returns: 'overdue' | 'today' | 'tomorrow' | 'future' | null
function followUpStatus(dateStr) {
  if (!dateStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(dateStr); d.setHours(0,0,0,0);
  const diff = Math.floor((d - today) / 86400000);
  if (diff < 0)  return 'overdue';
  if (diff === 0) return 'today';
  if (diff === 1) return 'tomorrow';
  return 'future';
}
function followUpLabel(status) {
  return { overdue:'Просрочен', today:'Сегодня', tomorrow:'Завтра', future:'' }[status] || '';
}

let DATA = [];
let sortKey = "fit", sortDir = -1;
let activeStageFilter = "";
let currentView = "table";
let funnelVisible = false;
let activeOnly = false;

/* ── FETCH ── */
async function loadJobs() {
  try {
    const r = await fetch("/api/jobs");
    if (!r.ok) throw new Error(r.status);
    DATA = await r.json();
    document.getElementById("loadingMsg").style.display = "none";
    document.getElementById("jobTable").style.display = "";
    populateStageFilter();
    render();
    stickyFix();
  } catch(e) {
    document.getElementById("loadingMsg").textContent = "Failed to load. Check /api/jobs is available.";
  }
}

/* ── GENERIC PATCH ── */
async function saveField(company, role, field, value) {
  try {
    const r = await fetch("/api/jobs", {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ company, role, [field]: value })
    });
    if (!r.ok) throw new Error(r.status);
    const job = DATA.find(j => j.company === company && j.role === role);
    if (job) job[field] = value;
    return true;
  } catch(e) {
    showToast("Error saving", true);
    return false;
  }
}

/* ── STAGE CHANGE ── */
async function changeStage(selectEl, company, role) {
  const newStage = selectEl.value;
  selectEl.classList.add("saving");
  try {
    const r = await fetch("/api/jobs", {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ company, role, stage: newStage })
    });
    if (!r.ok) throw new Error(r.status);
    const job = DATA.find(j => j.company === company && j.role === role);
    if (job) { job.stage = newStage; job.stage_updated_at = new Date().toISOString(); }
    showToast(`${company} → ${newStage}`);
    render();
  } catch(e) {
    showToast("Error saving", true);
    selectEl.value = DATA.find(j=>j.company===company&&j.role===role)?.stage || "";
  } finally {
    selectEl.classList.remove("saving");
  }
}

/* ── CYCLE PRIORITY ── */
async function cyclePrio(el, company, role) {
  const cur = el.dataset.prio === "null" ? null : parseInt(el.dataset.prio);
  let next;
  if (cur === null) next = 3;
  else if (cur === 0) next = null;
  else next = cur - 1;

  const pi = prioInfo(next);
  if (pi) {
    el.textContent = pi.emoji;
    el.title = pi.label;
    el.classList.remove("empty");
    el.dataset.prio = next;
  } else {
    el.textContent = "⊙";
    el.title = "Нажми чтобы задать приоритет";
    el.classList.add("empty");
    el.dataset.prio = "null";
  }
  const job = DATA.find(j => j.company === company && j.role === role);
  if (job) job.prio = next;
  await saveField(company, role, "prio", next);
}

/* ── NOTE EDIT ── */
function editNote(el) {
  if (el.querySelector("input")) return;
  const company = el.dataset.co;
  const role = el.dataset.role;
  const current = el.textContent.trim();
  el.innerHTML = `<input class="note-input" value="${esc(current)}" placeholder="add note…" maxlength="200">`;
  const input = el.querySelector("input");
  input.focus(); input.select();
  async function commit() {
    const val = input.value.trim();
    el.textContent = val;
    await saveField(company, role, "note", val);
  }
  input.onblur = commit;
  input.onkeydown = e => {
    if (e.key === "Enter") { e.preventDefault(); input.blur(); }
    if (e.key === "Escape") { el.textContent = current; }
  };
}

/* ── DATE UPDATE ── */
async function changeDateUpdate(inputEl, company, role) {
  const val = inputEl.value;
  const status = followUpStatus(val);
  inputEl.classList.toggle("has-date", !!val);
  inputEl.className = inputEl.className.replace(/\s*fu-\w+/g, '');
  if (val && status) inputEl.classList.add(`fu-${status}`);
  await saveField(company, role, "date_update", val);
  showToast(val ? `Follow-up: ${val}` : "Follow-up cleared");
  if (currentView === "focus") render();
}

/* ── TOAST ── */
let toastTimer;
function showToast(msg, isError=false) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.background = isError ? "#dc2626" : "#1f2937";
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2500);
}

/* ── FILTER / SORT ── */
function getView() {
  const q = document.getElementById("search").value.toLowerCase();
  const fS = document.getElementById("filterStage").value;
  let view = DATA.map((d,i)=>({d,i}));
  if(q)          view = view.filter(x=>(x.d.company+" "+x.d.role).toLowerCase().includes(q));
  if(fS)         view = view.filter(x=>x.d.stage===fS);
  if(activeOnly) view = view.filter(x=>ACTIVE_STAGES.has(x.d.stage));
  view.sort((a,b)=>{
    let va=a.d[sortKey], vb=b.d[sortKey];
    if(sortKey==="stage"){va=STAGES_ORDER[va]??99;vb=STAGES_ORDER[vb]??99;}
    if(sortKey==="date_added"){va=va||"";vb=vb||"";}
    if(sortKey==="prio"){va=va??-1;vb=vb??-1;}
    if(typeof va==="number") return(va-vb)*sortDir;
    return String(va).localeCompare(String(vb))*sortDir;
  });
  return view;
}

/* ── PIPELINE ── */
function renderPipeline() {
  const counts = {};
  STAGES.forEach(s=>counts[s]=0);
  DATA.forEach(d=>counts[d.stage]=(counts[d.stage]||0)+1);
  const pip = document.getElementById("pillsRow");
  let html = `<div class="pip ${activeStageFilter===''?'active-filter':''}" onclick="setStageFilter('')">
    <div class="pn">${DATA.length}</div><div class="pl">Total</div></div>`;
  STAGES.forEach((s,i)=>{
    if(!counts[s]) return;
    let cls = s==="NEW"?"s-new":s==="Closed"?"s-closed":["Applied","Screening","Interview"].includes(s)?"s-active":"";
    const arrow = i>0?'<span class="pip-arrow">›</span>':'';
    html+=`${arrow}<div class="pip ${cls} ${activeStageFilter===s?'active-filter':''}" onclick="setStageFilter('${s}')">
      <div class="pn">${counts[s]}</div><div class="pl">${s}</div></div>`;
  });
  pip.innerHTML = html;
  if (funnelVisible) renderFunnel(counts);
}

function renderFunnel(counts) {
  const row = document.getElementById("funnelRow");
  if (!funnelVisible) { row.classList.remove("show"); return; }
  const stageIdx = s => STAGES_ORDER[s] ?? 99;
  const funnelCounts = FUNNEL_STAGES.map(s =>
    DATA.filter(j => stageIdx(j.stage) >= stageIdx(s) && j.stage !== "Rejected" && j.stage !== "Closed").length
  );
  let html = "";
  FUNNEL_STAGES.forEach((s, i) => {
    const n = funnelCounts[i];
    const tc = STAGE_TC[s] || 'var(--text)';
    html += `<div class="f-step"><div class="f-step-num" style="color:${tc};">${n}</div><div class="f-step-label">${s}</div></div>`;
    if (i < FUNNEL_STAGES.length - 1) {
      const next = funnelCounts[i+1];
      const pct = n > 0 ? Math.round(next/n*100) : 0;
      const pctCls = pct >= 50 ? "good" : pct >= 25 ? "mid" : "low";
      html += `<div class="f-arrow"><div class="f-arrow-line">→</div><div class="f-arrow-pct ${pctCls}">${pct}%</div></div>`;
    }
  });
  row.innerHTML = html;
  row.classList.add("show");
  setTimeout(stickyFix, 0);
}

function toggleFunnel() {
  funnelVisible = !funnelVisible;
  document.getElementById("funnelToggleBtn").classList.toggle("active", funnelVisible);
  const row = document.getElementById("funnelRow");
  if (!funnelVisible) { row.classList.remove("show"); row.innerHTML = ""; setTimeout(stickyFix, 0); }
  render();
}

/* ── ACTIVE ONLY ── */
function toggleActiveOnly() {
  activeOnly = !activeOnly;
  document.getElementById("activeOnlyBtn").classList.toggle("on", activeOnly);
  updateClearBtn();
  render();
}

function setStageFilter(s){
  activeStageFilter=s;
  document.getElementById("filterStage").value=s;
  updateClearBtn();
  render();
}
function clearFilters(){
  document.getElementById("search").value="";
  activeStageFilter="";
  activeOnly=false;
  document.getElementById("filterStage").value="";
  document.getElementById("activeOnlyBtn").classList.remove("on");
  updateClearBtn();
  render();
}
function updateClearBtn(){
  document.getElementById("clearBtn").classList.toggle("visible",
    !!(document.getElementById("search").value || activeStageFilter || activeOnly));
}

/* ── TABLE (with Applied grouping) ── */
function renderTable(view) {
  const isAppliedView = view.every(({d}) => d.stage === "Applied") && view.length > 3;

  // Group Applied rows if showing mostly Applied
  let rows = "";
  if (isAppliedView) {
    const today = new Date(); today.setHours(0,0,0,0);
    const groups = [
      { key:'fresh',   label:'🌱 Свежие',       color:'#16a34a', items:[], test: d => daysSince(d) < 7  },
      { key:'waiting', label:'⏳ Жду ответа',    color:'#ca8a04', items:[], test: d => daysSince(d) >= 7 && daysSince(d) <= 21 },
      { key:'quiet',   label:'💤 Стало тихо',   color:'#dc2626', items:[], test: d => daysSince(d) > 21  },
    ];
    function daysSince(d) {
      const ref = d.stage_updated_at || d.date_added;
      if (!ref) return 999;
      return Math.floor((Date.now() - new Date(ref)) / 86400000);
    }
    view.forEach(({d}) => {
      const g = groups.find(g => g.test(d));
      if (g) g.items.push(d);
    });
    groups.forEach(g => {
      if (!g.items.length) return;
      rows += `<tr class="group-sep"><td colspan="10"><div class="group-label" style="color:${g.color};">
        ${g.label} <span class="group-count">${g.items.length}</span></div></td></tr>`;
      g.items.forEach(d => { rows += rowHtml(d); });
    });
  } else {
    view.forEach(({d}) => { rows += rowHtml(d); });
  }
  document.getElementById("rows").innerHTML = rows;
}

function rowHtml(d) {
  const [fb,ft]=fitBg(d.fit);
  const [ab,at]=avColor(d.company);
  const av=avInitials(d.company);
  const link=d.url?`<a class="lnk" href="${esc(d.url)}" target="_blank" rel="noopener">↗</a>`:"";
  const opts=STAGES.map(s=>`<option value="${s}"${s===d.stage?" selected":""}>${ICONS[s]||""} ${s}</option>`).join("");
  const bg=STAGE_C[d.stage]||"#f3f4f6";
  const tc=STAGE_TC[d.stage]||"#374151";

  // Days in stage — only show when > 0 and stage is active
  const dis = daysInStage(d);
  let daysBadge = "";
  const showDays = dis !== null && dis > 0 && !DIM_STAGES.has(d.stage) && d.stage !== "NEW";
  if (showDays) {
    const disClass = dis > 14 ? "overdue" : dis > 7 ? "stale" : "";
    daysBadge = `<div class="days-badge ${disClass}"><span class="days-num">${dis}d</span><span style="font-size:9px;color:#c4c9d4;"> in stage</span></div>`;
  }

  // Note
  const noteVal = d.note || "";
  const noteHtml = `<div class="co-note" data-co="${esc(d.company)}" data-role="${esc(d.role)}" data-ph="add note…" onclick="editNote(this)">${esc(noteVal)}</div>`;

  // Follow-up
  const dateVal = isoToDateInput(d.date_update) || d.date_update || "";
  const fuStatus = followUpStatus(dateVal);
  const fuCls = "date-inp" + (dateVal ? " has-date" : "") + (fuStatus ? ` fu-${fuStatus}` : "");

  // Prio
  const pi = prioInfo(d.prio);
  const prioCell = pi
    ? `<div class="prio-cell" title="${pi.label}" onclick="cyclePrio(this,'${esc(d.company)}','${esc(d.role)}')" data-prio="${d.prio}">${pi.emoji}</div>`
    : `<div class="prio-cell empty" title="Нажми чтобы задать приоритет" onclick="cyclePrio(this,'${esc(d.company)}','${esc(d.role)}')" data-prio="null">⊙</div>`;

  const dimClass = DIM_STAGES.has(d.stage) ? "row-dim" : "";

  return `<tr class="${dimClass}">
    <td style="padding:0;width:4px;"><div class="row-bar" style="background:${STAGE_ACCENT[d.stage]||'#e5e7eb'};"></div></td>
    <td style="padding:8px 4px 8px 10px;width:44px;"><div class="co-avatar" style="background:${ab};color:${at};">${av}</div></td>
    <td style="padding:8px 10px;">
      <div class="co-name">${esc(d.company)}</div>
      <div class="co-role">${esc(d.role)}</div>
      ${noteHtml}
    </td>
    <td style="padding:8px 6px;">
      <div class="stage-wrap">
        <select class="stage-select" style="background:${bg};color:${tc};" onchange="changeStage(this,'${esc(d.company)}','${esc(d.role)}')">${opts}</select>
        ${daysBadge}
      </div>
    </td>
    <td style="padding:8px 6px;">
      <input type="date" class="${fuCls}" value="${esc(dateVal)}" onchange="changeDateUpdate(this,'${esc(d.company)}','${esc(d.role)}')">
    </td>
    <td style="padding:8px 6px;"><div class="fit-sq" style="background:${fb};color:${ft};">${d.fit}</div></td>
    <td style="padding:8px 4px; text-align:center;">${prioCell}</td>
    <td style="padding:8px 6px;" class="salary-cell">${esc(d.salary)}</td>
    <td style="padding:8px 6px; font-size:11px; color:var(--muted); white-space:nowrap;">${daysAgo(d.date_added)}</td>
    <td style="padding:8px 8px 8px 0;text-align:right;">${link}</td>
  </tr>`;
}

/* ── FOCUS VIEW ── */
function renderFocusView() {
  const today = new Date(); today.setHours(0,0,0,0);

  // Section 1: Follow-ups due today or overdue
  const followUps = DATA.filter(d => {
    if (!d.date_update || DIM_STAGES.has(d.stage)) return false;
    const st = followUpStatus(d.date_update);
    return st === 'overdue' || st === 'today' || st === 'tomorrow';
  }).sort((a,b) => (a.date_update||'').localeCompare(b.date_update||''));

  // Section 2: Applied > 14 days no movement
  const stale = DATA.filter(d => {
    if (d.stage !== "Applied") return false;
    const ref = d.stage_updated_at || d.date_added;
    if (!ref) return false;
    return Math.floor((Date.now() - new Date(ref)) / 86400000) > 14;
  }).sort((a,b) => (a.stage_updated_at||'').localeCompare(b.stage_updated_at||''));

  // Section 3: Screening + Interview
  const active = DATA.filter(d => d.stage === "Screening" || d.stage === "Interview")
    .sort((a,b) => (STAGES_ORDER[a.stage]||0) - (STAGES_ORDER[b.stage]||0));

  function focusCard(d) {
    const [fb,ft] = fitBg(d.fit);
    const bg = STAGE_C[d.stage]||"#f3f4f6";
    const tc = STAGE_TC[d.stage]||"#374151";
    const fuStatus = followUpStatus(d.date_update);
    const fuBadge = fuStatus && d.date_update
      ? `<span class="focus-fu-badge focus-fu-${fuStatus}">${followUpLabel(fuStatus)} · ${d.date_update}</span>`
      : '';
    const dis = daysInStage(d);
    const disStr = dis !== null && dis > 0 ? `<span class="focus-days">${dis}d in stage</span>` : '';
    const link = d.url ? `<a class="focus-card-link" href="${esc(d.url)}" target="_blank" rel="noopener">↗</a>` : '';
    const pi = prioInfo(d.prio);
    const prioStr = pi ? `<span style="font-size:12px;">${pi.emoji}</span>` : '';
    return `<div class="focus-card">
      <div class="focus-card-main">
        <div class="focus-card-co">${esc(d.company)}</div>
        <div class="focus-card-role">${esc(d.role)}</div>
        <div class="focus-card-meta">
          <span class="focus-badge" style="background:${bg};color:${tc};">${d.stage}</span>
          ${fuBadge}
          ${disStr}
          ${prioStr}
        </div>
      </div>
      <div class="focus-card-fit" style="background:${fb};color:${ft};">${d.fit}</div>
      ${link}
    </div>`;
  }

  const sections = [
    {
      icon: '📅',
      title: 'Follow-ups',
      items: followUps,
      emptyText: 'Нет запланированных follow-up на ближайшие дни'
    },
    {
      icon: '💤',
      title: 'Нет ответа > 14 дней',
      items: stale,
      emptyText: 'Все Applications свежие — хороший знак'
    },
    {
      icon: '🎯',
      title: 'В процессе',
      items: active,
      emptyText: 'Нет активных Screening / Interview'
    },
  ];

  document.getElementById("focusView").innerHTML = sections.map(s => `
    <div class="focus-section">
      <div class="focus-section-head">
        <span style="font-size:16px;">${s.icon}</span>
        <span class="focus-section-title">${s.title}</span>
        <span class="focus-section-count">${s.items.length}</span>
      </div>
      ${s.items.length
        ? s.items.map(focusCard).join('')
        : `<div class="focus-empty">${s.emptyText}</div>`}
    </div>`).join('');
}

/* ── KANBAN ── */
function renderKanban(view) {
  const byStage={};
  STAGES.forEach(s=>byStage[s]=[]);
  view.forEach(({d})=>{ if(byStage[d.stage]) byStage[d.stage].push(d); });
  const show=STAGES.filter(s=>byStage[s].length>0||["To apply","Applied","Screening","Interview"].includes(s))
                   .filter(s=>s!=="Closed"||byStage["Closed"].length>0);
  document.getElementById("kanbanView").innerHTML=show.map(s=>{
    const cards=byStage[s];
    const cardHtml=cards.length===0?`<div class="k-empty">empty</div>`:
      cards.map(d=>{
        const[fb,ft]=fitBg(d.fit);
        const dis = daysInStage(d);
        const disStr = dis !== null && dis > 0 ? `<span style="font-size:10px;color:var(--muted);margin-left:4px;">${dis}d</span>` : "";
        return`<div class="k-card" style="border-left:3px solid ${STAGE_ACCENT[s]||'#e5e7eb'};">
          <div class="k-card-co">${esc(d.company)}</div>
          <div class="k-card-role">${esc(d.role)}</div>
          ${d.note ? `<div style="font-size:10px;color:#9ca3af;margin-top:4px;line-height:1.3;">${esc(d.note)}</div>` : ""}
          <div class="k-card-foot">
            <div style="display:flex;align-items:center;">
              <span class="k-salary">${esc(d.salary)}</span>${disStr}
            </div>
            <div class="k-fit" style="background:${fb};color:${ft};">${d.fit}</div>
          </div></div>`;
      }).join("");
    return`<div class="k-col">
      <div class="k-col-head">
        <span class="k-col-label" style="color:${STAGE_TC[s]||'var(--muted)'};">${s}</span>
        <span class="k-col-count">${cards.length}</span>
      </div>${cardHtml}</div>`;
  }).join("");
}

/* ── RENDER ── */
function render() {
  if(!DATA.length) return;
  renderPipeline();
  if (currentView === "table") {
    const view = getView();
    renderTable(view);
    document.querySelectorAll("th[data-sort]").forEach(th=>{
      th.classList.remove("asc","desc");
      if(th.dataset.sort===sortKey) th.classList.add(sortDir===1?"asc":"desc");
    });
  } else if (currentView === "focus") {
    renderFocusView();
  } else {
    renderKanban(getView());
  }
}

/* ── SORT ── */
document.querySelectorAll("th[data-sort]").forEach(th=>th.onclick=()=>{
  const k=th.dataset.sort;
  sortKey===k?sortDir*=-1:(sortKey=k,sortDir=k==="fit"?-1:1);
  render();
});

/* ── VIEW ── */
function setView(v){
  currentView=v;
  document.getElementById("tableView").style.display  = v==="table"  ? "" : "none";
  document.getElementById("focusView").classList.toggle("show", v==="focus");
  document.getElementById("kanbanView").classList.toggle("show", v==="kanban");
  document.getElementById("btnTable").classList.toggle("active",  v==="table");
  document.getElementById("btnFocus").classList.toggle("active",  v==="focus");
  document.getElementById("btnKanban").classList.toggle("active", v==="kanban");
  render();
}

/* ── EVENTS ── */
document.getElementById("search").addEventListener("input",()=>{updateClearBtn();render();});
document.getElementById("filterStage").addEventListener("change",e=>{
  activeStageFilter=e.target.value; updateClearBtn(); render();
});

function populateStageFilter(){
  const fs=document.getElementById("filterStage");
  STAGES.forEach(s=>{const o=document.createElement("option");o.value=s;o.textContent=s;fs.appendChild(o);});
}

/* ── STICKY FIX ── */
function stickyFix(){
  const tb=document.querySelector('.topbar');
  const pl=document.getElementById('pipeline');
  const to=document.querySelector('.toolbar');
  if(!tb||!pl||!to) return;
  const tbH=Math.round(tb.getBoundingClientRect().height);
  const plH=Math.round(pl.getBoundingClientRect().height);
  const toH=Math.round(to.getBoundingClientRect().height);
  pl.style.top=tbH+'px';
  to.style.top=(tbH+plH)+'px';
  document.querySelectorAll('thead th').forEach(th=>th.style.top=(tbH+plH+toH)+'px');
}
window.addEventListener('resize',stickyFix);

/* ── INIT ── */
loadJobs();
</script>
